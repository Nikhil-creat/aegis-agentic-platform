version: "3.9"

# ==================================================================
# Aegis Autonomous Agentic Platform
# Designed and Developed by NIKHIL CHARY SRIRAMOJU
# ==================================================================

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://aegis:${POSTGRES_PASSWORD:-aegis_pw}@postgres:5432/aegis
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  JWT_SECRET: ${JWT_SECRET:-change_me_super_secret}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

services:
  gateway:
    build: ./backend
    container_name: aegis-gateway
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports: ["8000:8000"]
    environment: *app-env
    depends_on: [postgres, redis, qdrant]
    networks: [aegis-net]
    restart: unless-stopped

  worker:
    build: ./backend
    container_name: aegis-worker
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=4
    environment: *app-env
    depends_on: [redis, postgres]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # required to spawn sandbox containers
    networks: [aegis-net]
    restart: unless-stopped

  vision-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.vision
    container_name: aegis-vision
    environment: *app-env
    networks: [aegis-net]
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: aegis-frontend
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [gateway]
    networks: [aegis-net]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_pw}
      POSTGRES_DB: aegis
    volumes: [pg_data:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    networks: [aegis-net]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    command: redis-server --save 60 1 --loglevel warning
    volumes: [redis_data:/data]
    ports: ["6379:6379"]
    networks: [aegis-net]
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: aegis-qdrant
    volumes: [qdrant_data:/qdrant/storage]
    ports: ["6333:6333"]
    networks: [aegis-net]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: aegis-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    networks: [aegis-net]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: aegis-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes: [grafana_data:/var/lib/grafana]
    ports: ["3001:3000"]
    depends_on: [prometheus]
    networks: [aegis-net]
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: aegis-otel
    command: ["--config=/etc/otel-collector.yml"]
    volumes:
      - ./infra/otel-collector.yml:/etc/otel-collector.yml:ro
    ports: ["4317:4317"]
    networks: [aegis-net]
    restart: unless-stopped

networks:
  aegis-net:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  qdrant_data:
  grafana_data:
